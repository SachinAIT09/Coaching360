# Netlify: build the Vite app and publish dist/.
# The app uses hash routing (#/home), so no SPA redirect rule is needed.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Hashed build assets never change, so browsers can cache them for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
